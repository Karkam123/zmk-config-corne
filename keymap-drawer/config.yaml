# Optional configuration for keymap-drawer.
# Docs: https://github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md

draw_config:
  shrink_wide_legends: 11
  dark_mode: auto

parse_config:
  zmk_preamble: "#define KEYMAP_DRAWER"

  raw_binding_map:
    '&sys_reset': Reset
    '&bootloader': Boot
    '&swapper': Swapper
    '&tabber': Tabber
    '&caps_word_ru': Caps Word
    '&kp LA(LSHFT)': Lang Next
    '&kp LG(TAB)': Task View

    '&to_rus': RU JCUKEN
    '&to_colemak': EN COLEMAK
    '&to_qwerty': EN QWERTY

    '&kp LC(LG(LEFT))': Desk Left
    '&kp LC(LG(RIGHT))': Desk Right
    '&kp LA(F4)': Win Close
    '&kp LC(F4)': Tab Close
    '&kp LC(HOME)': First Line
    '&kp LC(END)': Last Line
    '&kp LC(PG_UP)': Prev Tab
    '&kp LC(PG_DN)': Next Tab
    '&kp K_APP': Menu

    '&kp LG(LS(S))': Snipping Tool
    '&kp LG(V)': Clip board
    '&kp LG(D)': Show Desk

    '&out OUT_USB': Out USB
    '&out OUT_BLE': Out BLE

    '&bt BT_SEL 0': BT 1
    '&bt BT_SEL 1': BT 2
    '&bt BT_SEL 2': BT 3
    '&bt BT_SEL 3': BT 4
    '&bt BT_SEL 4': BT 5
    '&bt BT_CLR': BT Clear

    '&mmv MOVE_UP': Mouse ↑
    '&mmv MOVE_DOWN': Mouse ↓
    '&mmv MOVE_LEFT': Mouse ←
    '&mmv MOVE_RIGHT': Mouse →

    '&msc SCRL_UP': Scroll ↑
    '&msc SCRL_DOWN': Scroll ↓
    '&msc SCRL_LEFT': Scroll ←
    '&msc SCRL_RIGHT': Scroll →

    '&mkp LCLK': Left Click
    '&mkp RCLK': Right Click
    '&mkp MCLK': Middle Click
    '&mkp MB4': Back Click
    '&mkp MB5': Forward Click

    # ---- Unicode-символы (слой SYM) ----
    '&uc 0x0060 0x007E': '`'
    '&uc 0x002A 0x002A': '*'
    '&uc 0x002D 0x2013': '-'
    '&uc 0x002B 0x002B': '+'
    '&uc 0x005C 0x007C': '\'
    '&uc 0x0022 0x0022': '"'
    '&uc 0x003A 0x003A': ':'
    '&uc 0x003B 0x003B': ';'
    '&uc 0x005F 0x005F': '_'
    '&uc 0x003F 0x003F': '?'
    '&uc 0x007C 0x007C': '|'
    '&uc 0x0025 0x0025': '%'
    '&uc 0x003C 0x003E': '<'
    '&uc 0x007B 0x007B': '{'
    '&uc 0x005B 0x005B': '['
    '&uc 0x0028 0x0028': '('
    '&uc 0x005E 0x005E': '^'
    '&uc 0x0027 0x0027': "'"
    '&uc 0x0026 0x0026': '&'
    '&uc 0x0040 0x0040': '@'
    '&uc 0x003E 0x003E': '>'
    '&uc 0x007D 0x007D': '}'
    '&uc 0x005D 0x005D': ']'
    '&uc 0x0029 0x0029': ')'
    '&uc 0x0024 0x0024': {t: '$', s: '(S) ₽'}
    '&uc 0x0023 0x0023': {t: '#', s: '(S) №'}
    '&uc 0x002E 0x002E': '.'
    '&uc 0x002C 0x002C': ','
    '&uc 0x003D 0x003D': '='
    '&uc 0x0021 0x0021': '!'
    '&uc 0x002F 0x002F': '/'

    # ---- Прочие behaviours ----
    '&alt_dash': {t: '-', s: (S) NB}
    '&alt_space': {t: '␣', s: (CA) NB}

    '&kp LC(Z)': Undo
    '&kp LC(Y)': Redo
    '&kp LC(X)': Cut
    '&kp LC(C)': Copy
    '&kp LC(V)': Paste

    '&kp LC(EQUAL)': Zoom In
    '&kp LC(MINUS)': Zoom Out
    '&kp LC(N0)': Zoom Default

    '&mouse_layer': MOUSE
    '&slow_mouse_mode': Slow Mouse Mode
    '&fast_mouse_mode': Fast Mouse Mode
    '&hscroll_mouse_mode': H.Scroll Mouse Mode
    '&vscroll_mouse_mode': V.Scroll Mouse Mode

  zmk_combos:
    bt_left_combo: { align: bottom }
    bt_right_combo: { align: bottom }

  zmk_keycode_map:
    # ---- Кастомные подписи ----
    C_VOL_UP: Vol Up
    C_VOL_DN: Vol Down
    C_BRI_UP: Bright Up
    C_BRI_DN: Bright Down
    C_AL_CALC: Calc

    LCTRL: Ctrl
    RCTRL: Ctrl
    LALT: Alt
    RALT: Alt
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift
    ESC: Esc
    SPACE: ␣
    BSPC: ⌫
    RET: ⏎
    TAB: ↹
    DEL: ⌦

    PG_UP: Page Up
    PG_DN: Page Down
    INS: Insert
    HOME: Home
    END: End
    CAPS: Caps Lock
    PSCRN: Print Screen
    PAUSE_BREAK: Pause Break

    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →

    C_PP: ⏯
    C_NEXT: ⏭️
    C_PREV: ⏮️

    # ---- Буквы: латиница + кириллица (ЙЦУКЕН) ----
    Q: {t: 'Q', s: 'Й'}
    W: {t: 'W', s: 'Ц'}
    E: {t: 'E', s: 'У'}
    R: {t: 'R', s: 'К'}
    T: {t: 'T', s: 'Е'}
    Y: {t: 'Y', s: 'Н'}
    U: {t: 'U', s: 'Г'}
    I: {t: 'I', s: 'Ш'}
    O: {t: 'O', s: 'Щ'}
    P: {t: 'P', s: 'З'}

    A: {t: 'A', s: 'Ф'}
    S: {t: 'S', s: 'Ы'}
    D: {t: 'D', s: 'В'}
    F: {t: 'F', s: 'А'}
    G: {t: 'G', s: 'П'}
    H: {t: 'H', s: 'Р'}
    J: {t: 'J', s: 'О'}
    K: {t: 'K', s: 'Л'}
    L: {t: 'L', s: 'Д'}

    Z: {t: 'Z', s: 'Я'}
    X: {t: 'X', s: 'Ч'}
    C: {t: 'C', s: 'С'}
    V: {t: 'V', s: 'М'}
    B: {t: 'B', s: 'И'}
    N: {t: 'N', s: 'Т'}
    M: {t: 'M', s: 'Ь'}

    # ---- Символы, у которых в русской раскладке своя буква/знак ----
    LBKT:  {t: '[', s: 'Х'}
    RBKT:  {t: ']', s: 'Ъ'}
    SEMI:  {t: ';', s: 'Ж'}
    SQT:   {t: "'", s: 'Э'}
    COMMA: {t: ',', s: 'Б'}
    DOT:   {t: '.', s: 'Ю'}
    FSLH:  {t: '/', s: '.'}

    # ---- ЦИФРЫ: цифра + символ Shift+цифра в русской ЙЦУКЕН ----
    N0: {t: '0', s: ')'}
    N1: {t: '1', s: '!'}
    N2: {t: '2', s: '"'}
    N3: {t: '3', s: '№'}
    N4: {t: '4', s: ';'}
    N5: {t: '5', s: '%'}
    N6: {t: '6', s: ':'}
    N7: {t: '7', s: '?'}
    N8: {t: '8', s: '*'}
    N9: {t: '9', s: '('}

    # ---- Символы, которые в русской раскладке живут на других местах ----
    QMARK:         {t: '?', s: 'RU: S+7'}
    DOUBLE_QUOTES: {t: '"', s: 'RU: S+2'}
    COLON:         {t: ':', s: 'RU: S+6'}
    EXCL:          {t: '!', s: 'RU: S+1'}
    PERCENT:       {t: '%', s: 'RU: S+5'}

    # ---- Остальные defaults ----
    AMPERSAND: '&'
    AMPS: '&'
    APOS: "'"
    APOSTROPHE: "'"
    ASTERISK: '*'
    ASTRK: '*'
    AT: '@'
    AT_SIGN: '@'
    BACKSLASH: '\'
    BSLH: '\'
    CARET: '^'
    DLLR: $
    DOLLAR: $
    DQT: '"'
    EQUAL: '='
    EXCLAMATION: '!'
    GRAVE: '`'
    GREATER_THAN: '>'
    GT: '>'
    HASH: '#'
    LBRC: '{'
    LEFT_BRACE: '{'
    LEFT_BRACKET: '['
    LEFT_PARENTHESIS: (
    LESS_THAN: <
    LPAR: (
    LT: <
    MINUS: '-'
    NON_US_BACKSLASH: '\'
    NON_US_BSLH: '|'
    NON_US_HASH: '#'
    NUHS: '#'
    PERIOD: .
    PIPE: '|'
    PIPE2: '|'
    PLUS: +
    POUND: '#'
    PRCNT: '%'
    QUESTION: '?'
    RBRC: '}'
    RIGHT_BRACE: '}'
    RIGHT_BRACKET: ']'
    RIGHT_PARENTHESIS: )
    RPAR: )
    SEMICOLON: ;
    SINGLE_QUOTE: "'"
    SLASH: /
    STAR: '*'
    TILDE: '~'
    TILDE2: '~'
    UNDER: _
    UNDERSCORE: _

    KP_MULTIPLY: 'KP *'
    KP_SLASH: 'KP /'
    KP_DIVIDE: 'KP /'
    KP_PLUS: 'KP +'
    KP_MINUS: 'KP -'
    KP_DOT: 'KP .'