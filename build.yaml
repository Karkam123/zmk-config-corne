include:
  # Донгл с OLED
  - board: nice_nano_v2
    shield: corne_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: corne_central_dongle_oled

  # Левая половина (если шьёте без донгла — оставьте, иначе уберите)
  - board: nice_nano_v2
    shield: corne_central_left

  - board: nice_nano_v2
    shield: corne_peripheral_left
  - board: nice_nano_v2
    shield: corne_peripheral_right

  - board: nice_nano_v2
    shield: settings_reset
  - board: seeeduino_xiao_ble
    shield: settings_reset